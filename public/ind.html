        <form class="chat-input-area-fake" action="#" method="GET">
            <input type="text" class="input-placeholder" placeholder="Escreva uma mensagem para o Aranha..." required autocomplete="off">
            <button type="submit" class="btn-fake">Enviar</button>
        </form>
